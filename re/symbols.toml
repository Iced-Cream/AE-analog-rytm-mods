[data.machine_voice_mask]
addr = 0x4018d8c9
status = "verified"
evidence = "Read by 0x40006fc6(machine, voice) as byte 0x4018d869[machine * 2], bit voice. BD/SD machines hold 0x85 (voices 0, 2, 7 - the dual-VCO voices), CH 0x10, CY/CB 0x40; machines 34..52 hold 0, which is how they are hidden. Callers include set-machine-on-track 0x400ba1e2, the kit setter 0x400a3e4c and the audio interrupt (0x40118dc4)."

[fn.bd_classic_machine]
