# Analog Rytm MK1 symbol map, OS 1.74 (every addr ported from 1.73 by tools/port_os.py,
# 2026-10-17; the evidence texts still cite 1.73 addresses - docs/PORT-1.74.md).
#
# Addresses are virtual (load base 0x40000400); file_offset = addr - 0x40000400.
# Every entry was located in THIS image and names the MKII 1.73 address it ports
# (mk2 = ...), taken from the MKII rytm-mods project's
# re/symbols.toml. The two builds are the same C++ code base:
# code with no absolute addresses in it is byte-identical, shifted by a delta that
# is constant over long runs (e.g. -0x1fec over all of trig_fire).
#
# status = "verified"  found in this image AND checked against what the MKII note
#                      says the routine does (offsets, constants, callers)
#          "mapped"    at the delta-predicted address and a routine starts there,
#                      but its behaviour was not checked beyond that
# evidence = how it was found / checked. Nothing here is "external".
#
# Entries for the original rytm1_mods set (euclid accents, velocity humanise, LFO
# RND, SMP CUT) are kept: they document the firmware, even though those mods are not
# in this repository.

[meta]
target        = "OS1.74"
device        = "Analog Rytm MK1"
base          = 0x40000400
mainos_size   = 2824228
mainos_sha256 = "6d021e22e8912cfc1ee84e619c35db0174455cbc42bf64dbec1f1d06a5ab811d"

# The MK1 container carries ONE section (MAIN OS). There is no separate bootstrap
# section: the bootstrap image rides INSIDE MAIN OS and the OS re-flashes it itself
# when its version word is newer than the one in flash. See docs/HAZARDS.md.
embedded_bootstrap_start  = 0x4028c768          # version words, then the image
embedded_bootstrap_end    = 0x402a1b84          # exclusive; the flasher's loop bound
embedded_bootstrap_sha256 = "de6b772035258ab79effcefd00907b2471ac6cca2f96f8453efb4cbc1738c3de"

# Assembler target: ColdFire V4 with EMAC, no FPU (the image uses mvz/mvs, sats,
# mov3q and mac/msac/movclr, and no FPU instructions in code).
cpu = "5475"
cpu_flags = ["-mno-float"]

